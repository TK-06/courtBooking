@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171213;--paper-2:#201819;--sunk:#2A2223;
  --ink:#F0E7DB;--ink-2:#C5B8AC;--ink-3:#968A82;
  --rule:rgba(240,231,219,.12);--rule-strong:rgba(240,231,219,.26);
  --crimson:#E07A86;--crimson-tint:#3B1D22;--btn:#962B3A;--btn-hover:#A93545;--on-crimson:#FBF5EC;
  --camel:#C9A57A;--camel-ink:#D9BA8E;--camel-tint:#32281C;
  --court:#8A2231;--apron:#4E111B;--line:#EBDDC9;
  --closed:#4A4442;--closed-apron:#3B3634;--closed-line:#6F6864;--closed-ink:#A89F98;
  --ok:#93C3A0;--ok-tint:#1E2C22;--warn:#E3AA62;--warn-tint:#352A1B;--danger:#E8838F;--danger-fill:#A8303F;
  --ball:#BDB75B;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171213;--paper-2:#201819;--sunk:#2A2223;
  --ink:#F0E7DB;--ink-2:#C5B8AC;--ink-3:#968A82;
  --rule:rgba(240,231,219,.12);--rule-strong:rgba(240,231,219,.26);
  --crimson:#E07A86;--crimson-tint:#3B1D22;--btn:#962B3A;--btn-hover:#A93545;--on-crimson:#FBF5EC;
  --camel:#C9A57A;--camel-ink:#D9BA8E;--camel-tint:#32281C;
  --court:#8A2231;--apron:#4E111B;--line:#EBDDC9;
  --closed:#4A4442;--closed-apron:#3B3634;--closed-line:#6F6864;--closed-ink:#A89F98;
  --ok:#93C3A0;--ok-tint:#1E2C22;--warn:#E3AA62;--warn-tint:#352A1B;--danger:#E8838F;--danger-fill:#A8303F;
  --ball:#BDB75B;--scrim:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
[v-cloak]{display:none}

.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.015em;line-height:1.06;text-wrap:balance;font-variant-numeric:lining-nums}
.h-xl{font-size:clamp(36px,7.4vw,56px)}
.h-lg{font-size:clamp(30px,5.6vw,42px)}
.h-md{font-size:27px}
.h-sm{font-size:22px}
.label{font-family:var(--f-label);font-stretch:125%;font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.wordmark{font-family:var(--f-label);font-stretch:125%;font-weight:700;letter-spacing:.16em;text-transform:uppercase;line-height:1.15;color:var(--ink)}
.date-line{font-size:14px;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.sm{font-size:13px}
.mono{font-family:var(--f-mono);font-size:.9em;letter-spacing:.03em}
.center{text-align:center}
.lede{color:var(--ink-2);max-width:58ch;font-size:16px}
.err{color:var(--danger);font-size:13px}
.row-between{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{font-size:12px;color:var(--ink-3);max-width:62ch}

.logo{display:inline-block;flex:none;background:currentColor;-webkit-mask:var(--logo-full) center/contain no-repeat;mask:var(--logo-full) center/contain no-repeat}
.logo-mark{-webkit-mask-image:var(--logo-mark);mask-image:var(--logo-mark)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r-s);font-weight:500;font-size:15px;letter-spacing:.01em;white-space:nowrap;transition:background-color 150ms var(--ease),border-color 150ms var(--ease),transform 150ms var(--ease)}
.btn:active{transform:translateY(1px) scale(.985);transition-duration:90ms}
.btn.primary{background:var(--btn);color:var(--on-crimson)}
.btn.ghost{border:1px solid var(--rule-strong)}
.btn.danger{background:var(--danger-fill);color:#FBF5EC}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:0 16px;font-size:14px}
.btn svg{transition:transform 150ms var(--ease)}
.danger-text{color:var(--danger)}
.linkbtn{display:inline-block;color:var(--crimson);font-weight:500;font-size:14px;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;box-shadow:inset 0 -1px 0 var(--rule-strong);transition:background-size 150ms var(--ease)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-m);color:var(--ink-2);flex:none;transition:background-color 150ms var(--ease)}
.lift{transition:transform 180ms var(--ease),border-color 180ms var(--ease)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{transform:translateY(-1px)}
  .btn.primary:hover{background:var(--btn-hover)}
  .btn.ghost:hover{background:var(--sunk);border-color:var(--ink-3)}
  .btn:hover svg.go{transform:translateX(3px)}
  .btn:active{transform:translateY(1px) scale(.985)}
  .linkbtn:hover{background-size:100% 1px}
  .icon-btn:hover{background:var(--sunk);color:var(--ink)}
  .lift:hover{transform:translateY(-2px);border-color:var(--rule-strong)}
}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:var(--r-s);white-space:nowrap}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip.muted{background:var(--sunk);color:var(--ink-2)}
.chip.crimson{background:var(--crimson-tint);color:var(--crimson)}
.chip.camel{background:var(--camel-tint);color:var(--camel-ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--ok)}
.dot.closed{background:var(--closed-ink)}

.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r-l);padding:20px;min-width:0}
.home-grid,.s2,.s3,.detail-grid,.borrow-grid,.club-grid,.prof-grid,.two,.members-grid,.court-admin-grid,.club-hero{grid-template-columns:minmax(0,1fr)}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r-m);padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{min-height:38px;padding:0 14px;border-radius:var(--r-s);font-size:14px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--paper-2);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.seg .count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=email],input[type=password],input[type=search],input:not([type]),textarea{width:100%;min-height:48px;border-radius:var(--r-s);border:1px solid var(--rule-strong);background:var(--paper-2);padding:12px 14px;font:inherit;color:inherit;transition:border-color 140ms var(--ease),box-shadow 140ms var(--ease)}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{outline:none;border-color:var(--crimson);box-shadow:0 0 0 3px var(--crimson-tint)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.search{max-width:320px}

/* shell */
.side{display:none}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.top-brand{display:flex;align-items:center;gap:10px;color:var(--crimson)}
.top-brand .wordmark{font-size:14px;color:var(--ink)}
.top-actions{display:flex;align-items:center;gap:4px}
.avatar,.avatar-btn{display:inline-grid;place-items:center;border-radius:50%;background:var(--btn);color:var(--on-crimson);font-family:var(--f-display);font-weight:500;flex:none}
.avatar-btn{width:36px;height:36px;font-size:15px;margin:4px}
.avatar.sm{width:34px;height:34px;font-size:14px}
.avatar.xl{width:80px;height:80px;font-size:32px}
.page{max-width:1160px;margin:0 auto;padding-top:24px;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper-2);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--ink-3);min-width:0;min-height:56px}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{color:var(--crimson)}
.tab.on::after{content:"";position:absolute;top:-1px;left:50%;width:28px;height:2px;margin-left:-14px;background:var(--crimson)}
@media (min-width:980px){
  .shell.authed{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;border-right:1px solid var(--rule);padding:26px 16px 20px}
  .top,.tabs{display:none}
  .page{padding-top:48px;padding-bottom:72px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;color:var(--crimson)}
.brand .wordmark{font-size:12.5px}
.nav{display:flex;flex-direction:column}
.nav button,.nav-switch{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;color:var(--ink-2);font-size:14.5px;width:100%;transition:color 150ms var(--ease)}
.nav button:hover,.nav-switch:hover{color:var(--ink)}
.nav button.on{color:var(--crimson);font-weight:500}
.nav button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--crimson)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule);padding-top:16px}
.side-user{display:flex;align-items:center;gap:10px;padding:0 8px;min-width:0}
.side-user strong{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user span{display:block;font-size:12px;color:var(--ink-3)}
.side-foot .linkbtn{align-self:flex-start;margin-left:8px}
.side-note{font-size:11.5px;color:var(--ink-3);padding:0 8px;line-height:1.45}

/* motion: one entrance on load, screen swaps settle, hover and press on controls */
.screen{animation:settle .32s var(--ease-enter)}
.step{animation:settle .32s var(--ease-enter)}
.enter{animation:enter .7s var(--ease-enter) both}
.enter.e2{animation-delay:.12s}

/* profile */
.prof-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:18px}

.heat{margin-top:18px;overflow-x:auto}

.hc{display:block;aspect-ratio:1;border-radius:3px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule)}

.heat-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:12px;color:var(--ink-2)}

.prof-actions{display:flex;flex-direction:column;margin-top:20px;border-top:1px solid var(--rule)}
.list-btn{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 4px;width:100%;font-size:15px;border-bottom:1px solid var(--rule);transition:color 150ms var(--ease)}
.list-btn:hover{color:var(--crimson)}
.list-btn .end{margin-left:auto;color:var(--ink-3)}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-l);overflow:hidden;margin-bottom:16px}
@media (min-width:860px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--paper-2);padding:16px 18px}
.kpi .v{font-family:var(--f-display);font-weight:500;font-size:42px;line-height:1;color:var(--crimson);font-variant-numeric:lining-nums tabular-nums}
.kpi .v small{font-size:22px;color:var(--ink-3)}
.kpi .l{font-size:13px;color:var(--ink-2);margin-top:6px}
.sched{overflow-x:auto;margin-top:16px;padding-bottom:4px}
.sched-in{min-width:700px;display:flex;flex-direction:column;gap:5px}
.sched-row{display:grid;grid-template-columns:84px repeat(14,minmax(0,1fr));gap:4px;align-items:center}
.sh{font-size:11px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.sr-name{font-family:var(--f-display);font-weight:500;font-size:18px}
.sc{height:44px;border-radius:var(--r-s);background:var(--sunk);font-size:11px;font-weight:500;display:grid;place-items:center;color:var(--ink-3)}
.sc.b{background:var(--court);color:var(--line)}
.sc.b.past{opacity:.55}
.sc.past{opacity:.6}
.sc.x{background:repeating-linear-gradient(135deg,var(--closed) 0 6px,var(--closed-apron) 6px 12px)}
.two{display:grid;gap:16px;margin-top:16px}
@media (min-width:900px){.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-l);background:var(--paper-2)}
.table-wrap.flat{border:0;border-radius:0;background:transparent;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--f-label);font-stretch:125%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
@media (hover:hover) and (pointer:fine){tbody tr:hover td{background:var(--sunk)}}
td.right{text-align:right}
td.wrap{white-space:normal;min-width:240px}
.empty-cell{text-align:center;color:var(--ink-3);padding:28px}
.table-note{font-size:13px;color:var(--ink-3);margin-top:10px}
.court-admin-grid{display:grid;gap:16px;margin-top:20px}
@media (min-width:860px){.court-admin-grid{grid-template-columns:1fr 1fr}}
.court-admin{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.court-admin svg{height:230px;width:auto}
.ca-body{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:520px){.court-admin{grid-template-columns:1fr}.court-admin svg{height:200px;margin:0 auto}}
.members-grid{display:grid;gap:16px}
@media (min-width:1000px){.members-grid{grid-template-columns:340px minmax(0,1fr);align-items:start}}
.mlist{display:flex;flex-direction:column;border-top:1px solid var(--rule);margin-top:12px}
.mlist li{border-bottom:1px solid var(--rule)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 6px;width:100%;min-height:60px;transition:background-color 150ms var(--ease)}
.mrow:hover{background:var(--sunk)}
.mrow.on{background:var(--crimson-tint)}
.mrow.all{grid-template-columns:minmax(0,1fr) auto;font-weight:500}
.mr-info{display:flex;flex-direction:column;min-width:0}
.mr-info strong{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-stats{display:flex;flex-direction:column;align-items:flex-end;font-size:13px}
.act-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* overlays */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s var(--ease)}
.sheet{width:100%;max-width:520px;background:var(--paper-2);border-radius:var(--r-l) var(--r-l) 0 0;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .28s var(--ease-enter)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--rule-strong);margin:0 auto 4px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:var(--r-l);padding:24px}.grab{display:none}}
.sheet-sum{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:var(--r-m);background:var(--sunk)}
.sheet-sum .t-date{min-width:54px;padding-right:14px}
.sheet-sum .t-day{font-size:40px}
.sheet-sum .t-title{font-size:22px}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.rchip{min-height:40px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--rule-strong);font-size:14px;transition:border-color 150ms var(--ease)}
.rchip.on{background:var(--crimson-tint);border-color:var(--crimson);color:var(--crimson)}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast-region{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.shell.flow .toast-region{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:980px){.toast-region{left:var(--side);bottom:32px}.shell.flow .toast-region{bottom:110px}}
.toast{background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:var(--r-m);font-size:14px;max-width:440px;animation:up .25s var(--ease-enter)}
</style>

<div id="app" v-cloak></div>

<script type="text/x-template" id="tpl">
<div class="shell" :class="{authed: !!auth, flow: auth && screen==='book'}">

<div v-if="!auth" class="signin">
  <div class="si-art">
    <club-logo class="si-logo"></club-logo>
    <court-art class="si-court" label="Tennis court"></court-art>
    <div>
      <h1 class="display si-title">Book a tennis court at CUB 13.</h1>
      <p class="si-sub">Two courts for Chula engineering students, open every day from 08:00 to 22:00.</p>
    </div>
    <p class="si-foot">Student prototype for an ISE course assignment, filled with sample data.</p>
  </div>
  <div class="si-form-wrap">
    <div class="si-form">
      <div class="seg full" role="tablist">
        <button role="tab" :aria-selected="authTab==='in'" :class="{on: authTab==='in'}" @click="authTab='in'; formErr=''">Sign in</button>
        <button role="tab" :aria-selected="authTab==='up'" :class="{on: authTab==='up'}" @click="authTab='up'; formErr=''">Create account</button>
      </div>
      <div>
        <h2 class="display h-lg">{{ authTab==='in' ? 'Sign in with your Chula email' : 'Create your account' }}</h2>
        <p class="muted" style="margin-top:8px">{{ authTab==='in' ? 'The one that ends in @student.chula.ac.th.' : 'You need your student ID and Chula email.' }}</p>
      </div>
      <form class="form" novalidate @submit.prevent="signIn">
        <div v-if="authTab==='up'" class="field"><label for="f-name">Full name</label><input id="f-name" v-model="form.name" autocomplete="name" placeholder="Napat Srisuk"></div>
        <div v-if="authTab==='up'" class="field"><label for="f-sid">Student ID</label><input id="f-sid" v-model="form.sid" inputmode="numeric" placeholder="6638012321"></div>
        <div class="field"><label for="f-email">Email</label><input id="f-email" v-model="form.email" type="email" autocomplete="email" placeholder="6638012321@student.chula.ac.th"></div>
        <div class="field"><label for="f-pass">Password</label><input id="f-pass" v-model="form.pass" type="password" autocomplete="current-password" placeholder="At least 8 characters"></div>
        <p v-if="formErr" class="err" role="alert">{{ formErr }}</p>
        <button class="btn primary block" type="submit">{{ authTab==='in' ? 'Sign in' : 'Create account' }}</button>
      </form>
      <div class="demo">
        <p class="label">Prototype shortcuts</p>
        <div class="demo-btns">
          <button class="btn ghost" @click="demo('student')">Preview as student</button>
          <button class="btn ghost" @click="demo('admin')">Preview as admin</button>
        </div>
      </div>
    </div>
  </div>
</div>

<template v-else>
  <aside class="side">
    <div class="brand"><club-logo variant="mark" :size="40"></club-logo><span class="wordmark">Intania<br>Tennis Club</span></div>
    <button class="btn primary block" @click="startBooking()">{{ mode==='admin' ? 'Book for the club' : 'Book a court' }}</button>
    <nav class="nav" aria-label="Main">
      <button v-for="t in navItems" :key="t.id" :class="{on: navOn(t.id)}" :aria-current="navOn(t.id) ? 'page' : null" @click="go(t.id)"><icon :name="t.icon"></icon>{{ t.label }}</button>
    </nav>
    <div class="side-foot">
      <button v-if="isAdmin" class="nav-switch" @click="switchMode()"><icon name="shield"></icon>{{ mode==='admin' ? 'Switch to student view' : 'Open admin' }}</button>
      <div class="side-user"><span class="avatar sm">{{ initials(me.name) }}</span><div style="min-width:0"><strong>{{ me.name }}</strong><span>{{ me.role==='admin' ? 'Club admin' : me.program + ', year ' + me.year }}</span></div></div>
      <button class="linkbtn" @click="signOut()">Sign out</button>
      <p class="side-note">Prototype with sample data. The clock is fixed at Tue 10 Nov 2026, 13:20.</p>
    </div>
  </aside>

  <div class="main">
    <header v-if="screen!=='book'" class="top">
      <div class="top-brand"><club-logo variant="mark" :size="30"></club-logo><span class="wordmark">ITC</span><span v-if="mode==='admin'" class="chip crimson">Admin</span></div>
      <div class="top-actions">
        <button v-if="isAdmin" class="icon-btn" :aria-label="mode==='admin' ? 'Switch to student view' : 'Open admin'" @click="switchMode()"><icon name="shield"></icon></button>
        <button v-if="mode==='student'" class="avatar-btn" aria-label="Open your profile" @click="go('profile')">{{ initials(me.name) }}</button>
      </div>
    </header>

    <main class="page">

<section v-if="screen==='home'" class="screen" :key="'home'">
  <div class="home-grid">
    <div class="home-main">
      <div class="greet enter">
        <p class="date-line">{{ longToday }}</p>
        <h1 class="display h-xl">{{ greeting }}, {{ me.first }}.</h1>
      </div>

      <div v-if="nextBooking" class="ticket lift enter e2" role="button" tabindex="0" aria-label="Open your next booking" @click="openBooking(nextBooking.id)" @keydown.enter.self="openBooking(nextBooking.id)">
        <div class="ticket-top">
          <p class="label">Next booking</p>
          <button class="icon-btn" aria-label="Booking options" :aria-expanded="menuId===nextBooking.id" @click.stop="toggleMenu(nextBooking.id)"><icon name="dots"></icon></button>
          <div v-if="menuId===nextBooking.id" class="menu" role="menu" @click.stop>
            <button role="menuitem" @click="openBooking(nextBooking.id)"><icon name="ticket" :size="18"></icon>View details</button>
            <button role="menuitem" class="danger" @click="openCancel(nextBooking.id)"><icon name="x" :size="18"></icon>Cancel booking</button>
          </div>
        </div>
        <div class="ticket-body">
          <div class="t-date"><span class="t-day">{{ dayNum(nextBooking.date) }}</span><span class="t-mon">{{ monShort(nextBooking.date) }}</span></div>
          <div class="t-info">
            <p class="t-title">{{ weekday(nextBooking.date) }}, {{ range(nextBooking) }}</p>
            <p class="t-sub">{{ courtName(nextBooking.court) }}, {{ durLabel(nextBooking) }}, {{ relDay(nextBooking.date).toLowerCase() }}</p>
          </div>
        </div>
        <div class="ticket-foot"><span class="code">{{ nextBooking.code }}</span><span class="t-link">View details<icon name="right" :size="16"></icon></span></div>
      </div>
      <div v-else class="empty-card enter e2">
        <p class="display h-sm">No court booked.</p>
        <p class="muted">Your next booking shows up here once you pick a date and an hour.</p>
      </div>

      <div class="sec-head"><h2 class="display h-md">Courts</h2><p class="muted sm">Tap a court for its open hours</p></div>
      <div class="courts">
        <button v-for="c in courts" :key="c.id" class="court-btn" :class="{closed: c.status!=='open'}" :aria-label="c.name + (c.status==='open' ? ', open. See hours' : ', closed')" @click="tapCourt(c)">
          <court-art :closed="c.status!=='open'" :label="c.name"></court-art>
          <span class="ct-row"><span class="dot" :class="c.status"></span><span class="ct-name">{{ c.name }}</span></span>
          <span class="ct-status">{{ c.status==='open' ? openCount(todayIso, c.id) + ' hours open today' : 'Closed for resurfacing' }}</span>
        </button>
      </div>
      <button class="btn primary block home-cta" @click="startBooking()">Book a court<icon name="right" :size="18" class="go"></icon></button>
    </div>

    <div class="home-side">
      <ul class="rows">
        <li><button class="row" @click="go('borrow')"><span class="row-ico"><racket-art></racket-art></span><span class="row-text"><strong>Borrow a racket or balls</strong><span>For one day, from the court attendant</span></span><icon name="right"></icon></button></li>
        <li><button class="row" @click="go('club')"><span class="row-ico"><icon name="pin" :size="22"></icon></span><span class="row-text"><strong>CUB 13, Chulalongkorn University</strong><span>Directions, Instagram and phone</span></span><icon name="right"></icon></button></li>
        <li><button class="row" @click="go('club')"><span class="row-ico"><icon name="list" :size="22"></icon></span><span class="row-text"><strong>Court rules</strong><span>Bring your own equipment, tidy up after</span></span><icon name="right"></icon></button></li>
      </ul>
      <div v-if="upcoming.length > 1">
        <h2 class="display h-sm">Also booked</h2>
        <ul class="blist" style="margin-top:10px">
          <li v-for="b in upcoming.slice(1, 4)" :key="b.id"><button class="brow" @click="openBooking(b.id)">
            <span class="br-date"><span class="br-day">{{ dayNum(b.date) }}</span><span class="br-mon">{{ monShort(b.date) }}</span></span>
            <span class="br-info"><span class="br-title">{{ weekday(b.date) }}, {{ range(b) }}</span><span class="br-sub">{{ courtName(b.court) }}</span></span>
            <span></span><icon name="right" :size="18" class="br-chev"></icon>
          </button></li>
        </ul>
      </div>
    </div>
  </div>
</section>

<section v-if="screen==='book'" class="screen flow-screen" :key="'book'">
  <div class="flow-head">
    <div class="fh-row">
      <button class="icon-btn" :aria-label="step===1 ? 'Close' : 'Back'" @click="flowBack()"><icon name="left"></icon></button>
      <div class="fh-title"><p class="label">Step {{ step }} of 4 · {{ stepNames[step-1] }}</p><h1 class="display">{{ stepTitle }}</h1></div>
      <button class="icon-btn" aria-label="Close booking" @click="exitFlow()"><icon name="x"></icon></button>
    </div>
    <div class="progress" aria-hidden="true"><span v-for="n in 4" :key="n" :class="{on: n <= step}"></span></div>
  </div>

  <div v-if="step===1" class="step s1">
    <div class="legend"><span><i class="lg"></i>Open</span><span><i class="lg lg-sel"></i>Selected</span><span><i class="lg lg-full"></i>Full</span><span><i class="lg lg-closed"></i>Closed</span></div>
    <p class="muted center">{{ isAdminFlow ? 'Club bookings can go up to 90 days ahead, at any length.' : 'You can book up to 14 days ahead.' }}</p>
    <div class="months">
      <div v-for="m in months" :key="m.key" class="month">
        <h2 class="month-name">{{ m.label }}</h2>
        <div class="dow"><span v-for="d in dows" :key="d">{{ d }}</span></div>
        <div class="days">
          <span v-for="n in m.offset" :key="'p' + n" class="day pad" aria-hidden="true"></span>
          <button v-for="d in m.days" :key="d.iso" class="day" :class="['s-' + d.status, {sel: draft.date===d.iso, today: d.iso===todayIso}]" :aria-label="fmtLong(d.iso) + ', ' + dayStatusText[d.status]" :aria-pressed="draft.date===d.iso" @click="pickDate(d)">{{ d.n }}</button>
        </div>
      </div>
    </div>
  </div>

  <div v-if="step===2" class="step s2">
    <div class="s2-courts">
      <h2 class="label">Court</h2>
      <div class="mini-courts">
        <button v-for="c in courts" :key="c.id" class="mini-court" :class="{on: draft.court===c.id && c.status==='open', closed: c.status!=='open'}" :aria-pressed="draft.court===c.id" @click="pickCourt(c)">
          <court-art :closed="c.status!=='open'" :label="c.name"></court-art>
          <span class="mc-name">{{ c.name }}</span>
          <span class="mc-sub">{{ c.status==='open' ? openCount(draft.date, c.id) + ' hours open' : 'Closed' }}</span>
        </button>
      </div>
    </div>
    <div class="s2-times">
      <div class="row-between"><h2 class="label">Hours on {{ courtName(draft.court) }}</h2><p class="hint">{{ isAdminFlow ? 'Any number of hours, back to back' : 'Up to 2 hours a day, back to back' }}</p></div>
      <div class="legend left"><span><i class="lg sq"></i>Open</span><span><i class="lg sq lg-sel"></i>Selected</span><span><i class="lg sq lg-booked"></i>Booked or past</span><span v-if="!isAdminFlow"><i class="lg sq lg-mine"></i>Yours</span></div>
      <div class="slots">
        <button v-for="s in slotList" :key="s.h" class="slot" :class="['s-' + s.state, {held: blocked && blocked.h===s.h, tap: isAdminFlow && (s.state==='booked' || s.state==='mine')}]" :aria-pressed="s.state==='selected'" :aria-label="hh(s.h) + ' to ' + hh(s.h + 1) + ', ' + slotLabel(s)" @click="toggleSlot(s)">
          <span class="slot-time">{{ hh(s.h) }}</span>
          <span class="slot-end">until {{ hh(s.h + 1) }}</span>
          <span class="slot-state">{{ slotLabel(s) }}</span>
        </button>
      </div>
      <div v-if="blocked" class="blocked" role="status">
        <p><strong>{{ hh(blocked.h) }} belongs to {{ bookerName(blocked.booking) }}</strong> ({{ blocked.booking.code }}, {{ range(blocked.booking) }}).</p>
        <p class="muted sm">Club bookings never replace a student's booking. To free this hour, cancel theirs under Bookings and explain why.</p>
        <div class="blocked-btns"><button class="btn ghost small" @click="goCancelFor(blocked.booking)">Open in Bookings</button><button class="linkbtn" style="color:var(--ink-2)" @click="blocked=null">Dismiss</button></div>
      </div>
    </div>
  </div>

  <div v-if="step===3" class="step s3">
    <div class="s3-main">
      <div class="ticket">
        <div class="ticket-top" style="padding-right:20px"><p class="label">Your booking</p></div>
        <dl class="dl">
          <div class="wide"><dt class="label">Date</dt><dd class="big">{{ fmtLong(draft.date) }}</dd></div>
          <div><dt class="label">Time</dt><dd class="big">{{ hh(draftStart) }}–{{ hh(draftEnd) }}</dd></div>
          <div><dt class="label">Court</dt><dd class="big">{{ courtName(draft.court) }}</dd></div>
          <div><dt class="label">Duration</dt><dd>{{ hoursText(draft.slots.length) }}</dd></div>
          <div><dt class="label">{{ isAdminFlow ? 'Booked by' : 'Player' }}</dt><dd>{{ isAdminFlow ? 'The club (' + me.first + ')' : me.name }}</dd></div>
          <div v-if="!isAdminFlow"><dt class="label">Student ID</dt><dd class="mono">{{ me.sid }}</dd></div>
        </dl>
        <div class="ticket-foot"><span class="code">Code issued when you confirm</span><club-logo variant="mark" :size="26"></club-logo></div>
      </div>
    </div>
    <div v-if="isAdminFlow" class="s3-rules">
      <h2 class="display h-md">What the hours are for</h2>
      <p class="muted">Students see these hours as booked by the club, with this title.</p>
      <div class="field"><label for="purpose">Title</label><input id="purpose" v-model="draft.purpose" maxlength="60" placeholder="Club training" @input="purposeErr=false"></div>
      <p v-if="purposeErr" class="err" role="alert">Add a short title, such as Club training or Inter-faculty match.</p>
    </div>
    <div v-else class="s3-rules">
      <h2 class="display h-md">Court rules</h2>
      <ul class="rules"><li v-for="r in rules" :key="r.t"><strong>{{ r.t }}</strong><span>{{ r.d }}</span></li></ul>
      <label class="agree" for="agree"><input id="agree" type="checkbox" v-model="draft.agree" @change="agreeErr=false"><span>I've read the court rules.</span></label>
      <p v-if="agreeErr" class="err" role="alert">Tick the box to confirm you've read the rules.</p>
    </div>
  </div>

  <div v-if="step===4 && lastBooking" class="step s4">
    <div class="done">
      <club-logo class="done-logo"></club-logo>
      <h1 class="display h-xl">{{ lastBooking.purpose ? 'Booked for the club.' : "You're booked." }}</h1>
      <p class="muted">{{ lastBooking.purpose ? lastBooking.purpose + ' is on the schedule. Students see these hours as taken.' : 'See you on ' + courtName(lastBooking.court) + ', ' + me.first + '.' }}</p>
      <div class="ticket">
        <div class="ticket-body" style="padding-top:18px">
          <div class="t-date"><span class="t-day">{{ dayNum(lastBooking.date) }}</span><span class="t-mon">{{ monShort(lastBooking.date) }}</span></div>
          <div class="t-info"><p class="t-title">{{ weekday(lastBooking.date) }}, {{ range(lastBooking) }}</p><p class="t-sub">{{ courtName(lastBooking.court) }}, {{ durLabel(lastBooking) }}</p></div>
        </div>
        <div class="ticket-foot"><span class="code">{{ lastBooking.code }}</span><span class="chip ok">Confirmed</span></div>
      </div>
      <div class="done-btns">
        <button class="btn primary" @click="openBooking(lastBooking.id)">View booking</button>
        <button class="btn ghost" @click="go(isAdminFlow ? 'admin-bookings' : 'home')">{{ isAdminFlow ? 'All bookings' : 'Back to home' }}</button>
      </div>
    </div>
  </div>

  <div v-if="step < 4" class="flow-bar">
    <div class="fb-inner">
      <div class="fb-sum">
        <template v-if="step===1"><strong>{{ draft.date ? fmtLong(draft.date) : 'Pick a date' }}</strong><span>{{ draft.date ? openTotal(draft.date) + ' hours open' : 'Open daily 08:00–22:00' }}</span></template>
        <template v-else><strong>{{ draft.slots.length ? hh(draftStart) + '–' + hh(draftEnd) : 'Pick an hour' }}</strong><span>{{ courtName(draft.court) }}, {{ fmtDate(draft.date) }}{{ draft.slots.length ? ', ' + hoursText(draft.slots.length) : '' }}</span></template>
      </div>
      <button class="btn primary" @click="flowNext()">{{ step===3 ? 'Confirm booking' : 'Next' }}<icon v-if="step < 3" name="right" :size="18" class="go"></icon></button>
    </div>
  </div>
</section>

<section v-if="screen==='booking' && selBooking" class="screen" :key="'booking-' + selBooking.id">
  <button class="back" @click="go(mode==='admin' ? 'admin-bookings' : 'bookings')"><icon name="left" :size="18"></icon>{{ mode==='admin' ? 'All bookings' : 'My bookings' }}</button>
  <div class="detail-grid">
    <div class="detail-col">
      <div class="detail-head">
        <h1 class="display h-lg">{{ fmtLong(selBooking.date) }}</h1>
        <span class="chip" :class="statusChip(selBooking)">{{ statusText(selBooking) }}</span>
      </div>
      <div class="ticket">
        <div class="ticket-body" style="padding-top:18px">
          <div class="t-date"><span class="t-day">{{ dayNum(selBooking.date) }}</span><span class="t-mon">{{ monShort(selBooking.date) }}</span></div>
          <div class="t-info"><p class="t-title">{{ range(selBooking) }}</p><p class="t-sub">{{ courtName(selBooking.court) }}, {{ durLabel(selBooking) }}</p></div>
        </div>
        <dl class="dl" style="border-top:1px solid var(--rule);padding-top:16px">
          <template v-if="selBooking.purpose"><div class="wide"><dt class="label">Club booking</dt><dd>{{ selBooking.purpose }}</dd></div></template>
          <template v-else><div><dt class="label">Player</dt><dd>{{ member(selBooking.userId).name }}</dd></div>
          <div><dt class="label">Student ID</dt><dd class="mono">{{ member(selBooking.userId).sid }}</dd></div></template>
          <div><dt class="label">Booked</dt><dd>{{ fmtStamp(selBooking.createdAt) }}</dd></div>
          <div v-if="selBooking.status==='cancelled'"><dt class="label">{{ selBooking.byClub ? 'Cancelled by the club' : 'Reason' }}</dt><dd>{{ selBooking.reason || 'None given' }}</dd></div>
          <div v-if="selBooking.status==='cancelled' && selBooking.note" class="wide"><dt class="label">Message from the club</dt><dd style="font-weight:400">{{ selBooking.note }}</dd></div>
        </dl>
        <div class="ticket-foot"><span class="code">{{ selBooking.code }}</span><club-logo variant="mark" :size="26"></club-logo></div>
      </div>
      <div v-if="statusOf(selBooking)==='upcoming' && mode==='admin'" class="cancel-zone">
        <p class="muted sm">To cancel this booking, find it under Bookings. You'll need a reason and a message for {{ selBooking.purpose ? 'the club' : member(selBooking.userId).first }}.</p>
        <button class="btn ghost small" style="align-self:flex-start" @click="goCancelFor(selBooking)">Open in Bookings</button>
      </div>
      <div v-else-if="statusOf(selBooking)==='upcoming'" class="cancel-zone">
        <button v-if="canCancel(selBooking)" class="btn ghost block danger-text" @click="openCancel(selBooking.id)">Cancel booking</button>
        <p class="muted sm">{{ canCancel(selBooking) ? 'You can cancel until ' + cutoffText(selBooking) + '.' : 'Cancelling closed 2 hours before the start time.' }}</p>
      </div>
    </div>
    <div class="detail-col">
      <div class="card">
        <h2 class="display h-sm">History</h2>
        <ul class="timeline" style="margin-top:8px">
          <li v-for="e in eventsFor(selBooking.id)" :key="e.id"><span class="tl-dot" :class="kindTail(e.kind)"></span><div><p class="tl-text">{{ e.text }}</p><p class="muted sm">{{ fmtStamp(e.at) }}, logged by {{ e.source }}</p></div></li>
          <li v-if="!eventsFor(selBooking.id).length"><span class="tl-dot"></span><div><p class="tl-text">{{ selBooking.id === lastBookingId ? 'Adding to the booking log…' : 'No log entries for this booking.' }}</p></div></li>
        </ul>
      </div>
      <div>
        <h2 class="display h-sm">Before you play</h2>
        <ul class="rules" style="margin-top:10px">
          <li><strong>Bring your own equipment</strong><span>Or borrow a racket and balls for the day.</span></li>
          <li><strong>Tidy up after</strong><span>Take balls, bottles and towels with you.</span></li>
        </ul>
      </div>
    </div>
  </div>
</section>

<section v-if="screen==='bookings'" class="screen" :key="'bookings'">
  <div class="page-head">
    <h1 class="display h-lg">My bookings</h1>
    <button class="btn primary small" @click="startBooking()"><icon name="plus" :size="18"></icon>Book a court</button>
  </div>
  <div class="seg" role="tablist">
    <button v-for="t in bookingTabs" :key="t.id" role="tab" :aria-selected="bTab===t.id" :class="{on: bTab===t.id}" @click="bTab=t.id">{{ t.label }}<span class="count">{{ t.n }}</span></button>
  </div>
  <ul v-if="bookingList.length" class="blist">
    <li v-for="b in bookingList" :key="b.id"><button class="brow" @click="openBooking(b.id)">
      <span class="br-date"><span class="br-day">{{ dayNum(b.date) }}</span><span class="br-mon">{{ monShort(b.date) }}</span></span>
      <span class="br-info"><span class="br-title">{{ weekday(b.date) }}, {{ range(b) }}</span><span class="br-sub">{{ courtName(b.court) }} <span class="mono">{{ b.code }}</span></span></span>
      <span class="chip" :class="statusChip(b)">{{ statusText(b) }}</span>
      <icon name="right" :size="18" class="br-chev"></icon>
    </button></li>
  </ul>
  <div v-else class="empty">
    <p class="display h-sm" style="color:var(--ink)">{{ bTab==='upcoming' ? 'No upcoming bookings' : bTab==='past' ? 'No games played yet' : 'No cancellations' }}</p>
    <p class="sm">{{ bTab==='upcoming' ? 'Book an hour and it shows up here.' : 'Your history fills in as you play.' }}</p>
    <button v-if="bTab==='upcoming'" class="btn primary small" @click="startBooking()">Book a court</button>
  </div>
</section>

<section v-if="screen==='borrow'" class="screen" :key="'borrow'">
  <div class="page-head"><div><h1 class="display h-lg">Borrow a racket or balls</h1><p class="lede">One day at a time. Pick up from the court attendant and return everything by 22:00 the same day.</p></div></div>
  <div class="borrow-grid">
    <div class="borrow-col">
      <h2 class="label">Day</h2>
      <div class="day-strip">
        <button v-for="d in borrowDays" :key="d.iso" class="dchip" :class="{on: loanDraft.date===d.iso, off: d.closed}" :aria-pressed="loanDraft.date===d.iso" :aria-label="fmtLong(d.iso)" @click="pickLoanDay(d)"><span>{{ d.wd }}</span><strong>{{ d.n }}</strong></button>
      </div>
      <div class="items">
        <div v-for="it in equipment" :key="it.id" class="item-row">
          <component :is="it.id==='racket' ? 'racket-art' : 'balls-art'" class="item-art"></component>
          <div style="min-width:0">
            <p class="item-name">{{ it.plural }}</p>
            <p class="avail"><span class="dot" :class="availFor(loanDraft.date, it.id) ? 'open' : 'closed'"></span>{{ availFor(loanDraft.date, it.id) }} of {{ it.total }} free, up to {{ it.max }} each</p>
          </div>
          <div class="stepper">
            <button :aria-label="'One fewer ' + it.name.toLowerCase()" @click="bump(loanDraft, it.id, -1, loanDraft.date)"><icon name="minus" :size="18"></icon></button>
            <span>{{ loanDraft[it.id] }}</span>
            <button :aria-label="'One more ' + it.name.toLowerCase()" @click="bump(loanDraft, it.id, 1, loanDraft.date)"><icon name="plus" :size="18"></icon></button>
          </div>
        </div>
      </div>
      <p v-if="loanErr" class="err" role="alert">{{ loanErr }}</p>
      <button class="btn primary block" @click="reserveLoan()">Reserve for {{ fmtDate(loanDraft.date) }}</button>
    </div>
    <div class="borrow-col">
      <h2 class="display h-md">Your loans</h2>
      <ul v-if="myLoans.length" class="loan-list">
        <li v-for="l in myLoans" :key="l.id" class="loan-row">
          <div><p class="lr-title">{{ capital(itemsText(l)) }}</p><p class="muted sm">{{ fmtDate(l.date) }}, back by 22:00</p></div>
          <span class="chip" :class="loanChip(l.status)">{{ loanLabel(l.status) }}</span>
        </li>
      </ul>
      <p v-else class="muted">Nothing borrowed yet.</p>
      <div class="card">
        <h2 class="display h-sm">How borrowing works</h2>
        <ol class="steps-mini">
          <li>Reserve here, up to 6 days ahead.</li>
          <li>Show your student ID to the court attendant.</li>
          <li>Return everything by 22:00 the same day.</li>
        </ol>
      </div>
    </div>
  </div>
</section>

    openTotal(date){ return this.courts.reduce((s, c) => s + this.openCount(date, c.id), 0); },
    dayStatus(ds){
      if (ds < TODAY) return 'past';
      if (ds > this.windowEnd) return 'out';
      if (this.closedDays[ds] || !this.courts.some(c => c.status === 'open')) return 'closed';
      return this.openTotal(ds) === 0 ? 'full' : 'open';
    },
    slotState(date, court, h){
      const c = this.court(court); if (!c || c.status !== 'open') return 'closed';
      if (at(date, h) <= NOW) return 'past';
      const b = this.bookings.find(b => b.date === date && b.court === court && b.status !== 'cancelled' && h >= b.start && h < b.end);
      if (b) return b.userId === this.auth.userId ? 'mine' : 'booked';
      return this.draft.slots.includes(h) ? 'selected' : 'open';
    },
    slotLabel(s){
      if (s.state === 'booked' && this.isAdminFlow && s.b) return s.b.purpose ? 'Club' : this.member(s.b.userId).first;
      if (s.state === 'mine' && this.isAdminFlow) return 'Club';
      return {open:'Open', selected:'Selected', booked:'Booked', mine:'Your booking', past:'Past', closed:'Closed'}[s.state];
    },
    bookingAt(date, court, h){ return this.bookings.find(b => b.date === date && b.court === court && b.status !== 'cancelled' && h >= b.start && h < b.end) || null; },
    bookerName(b){ return b.purpose ? 'Club booking: ' + b.purpose : this.member(b.userId).name; },
    hoursText(n){ return n === 1 ? '1 hour' : n + ' hours'; },
    goCancelFor(b){ this.abTab = this.statusOf(b) === 'upcoming' ? 'upcoming' : 'today'; this.abSearch = b.code; this.blocked = null; this.go('admin-bookings'); },
    myHoursOn(date){ return this.bookings.filter(b => b.userId === this.auth.userId && b.date === date && b.status !== 'cancelled').reduce((s, b) => s + b.end - b.start, 0); },

    toast(msg){ this.toastMsg = msg; this.toastKey++; clearTimeout(toastTimer); toastTimer = setTimeout(() => { this.toastMsg = ''; }, 2800); },
    applyScreen(s){
      if (s.indexOf('admin-') === 0){ if (!this.isAdmin) s = 'home'; else this.mode = 'admin'; }
      else if (s !== 'booking' && s !== 'book') this.mode = 'student';
      if (s === 'booking' && !this.selBooking){ this.selBookingId = this.nextBooking ? this.nextBooking.id : (this.myBookings[0] ? this.myBookings[0].id : null); if (!this.selBookingId) s = 'bookings'; }
      if (s === 'book' && this.screen !== 'book' && !keepDraft) this.resetDraft();
      keepDraft = false;
      this.screen = s; this.menuId = null; this.sheet = null;
      window.scrollTo(0, 0);
    },
    go(s){ this.applyScreen(s); try { if (location.hash.slice(1) !== this.screen) location.hash = this.screen; } catch (e) {} },
    navOn(id){ return this.screen === id || (id === 'bookings' && this.screen === 'booking' && this.mode === 'student') || (id === 'admin-bookings' && this.screen === 'booking' && this.mode === 'admin'); },
    demo(role, target){
      this.auth = {userId: role === 'admin' ? 'u7' : 'u1'};
      this.mode = role === 'admin' ? 'admin' : 'student';
      this.go(target || (role === 'admin' ? 'admin-overview' : 'home'));
    },
    signIn(){
      const f = this.form; const email = f.email.trim().toLowerCase();
      if (this.authTab === 'up' && (!f.name.trim() || !/^\d{10}$/.test(f.sid.trim()))){ this.formErr = 'Enter your full name and your 10-digit student ID.'; return; }
      if (!/^[^@\s]+@student\.chula\.ac\.th$/.test(email)){ this.formErr = 'Use your Chula student email, the one ending in @student.chula.ac.th.'; return; }
      if (f.pass.length < 8){ this.formErr = 'Your password needs at least 8 characters.'; return; }
      this.formErr = ''; this.demo('student'); this.toast('Signed in. This prototype shows sample data.');
    },
    signOut(){ this.auth = null; this.screen = 'signin'; this.mode = 'student'; try { location.hash = 'signin'; } catch (e) {} window.scrollTo(0, 0); },
    switchMode(){ this.go(this.mode === 'admin' ? 'home' : 'admin-overview'); },

    resetDraft(courtId){
      const open = this.courts.find(c => c.status === 'open');
      this.draft = {date:null, court: courtId || (open ? open.id : 1), slots:[], agree:false, purpose:''};
      this.step = 1; this.agreeErr = false; this.purposeErr = false; this.blocked = null;
    },
    startBooking(courtId){
      if (!this.courts.some(c => c.status === 'open')){ this.toast('Both courts are closed right now.'); return; }
      this.resetDraft(courtId); keepDraft = true; this.go('book');
    },
    tapCourt(c){ if (c.status !== 'open'){ this.toast(c.name + ': ' + (c.note || 'closed for now.')); return; } this.startBooking(c.id); },
    pickDate(d){
      if (d.status === 'past') return;
      if (d.status === 'out'){ this.toast(this.isAdminFlow ? 'Club bookings can go up to 90 days ahead.' : 'You can book up to 14 days ahead.'); return; }
      if (d.status === 'closed'){ this.toast((this.closedDays[d.iso] || 'The courts are closed that day.') + (this.isAdminFlow ? ' Reopen it under Courts first.' : '')); return; }
      if (d.status === 'full' && !this.isAdminFlow){ this.toast('Every hour on ' + fmtDate(d.iso) + ' is taken. Try another day.'); return; }
      if (this.draft.date !== d.iso){ this.draft.date = d.iso; this.draft.slots = []; this.blocked = null; }
    },
    pickCourt(c){ if (c.status !== 'open'){ this.toast(c.name + ': ' + (c.note || 'closed for now.') + (this.isAdminFlow ? ' Reopen it under Courts to book it.' : '')); return; } if (this.draft.court !== c.id){ this.draft.court = c.id; this.draft.slots = []; this.blocked = null; } },
    toggleSlot(s){
      if (this.isAdminFlow){
        if (s.state === 'booked' || s.state === 'mine'){ this.blocked = {h:s.h, booking:s.b}; return; }
        if (s.state !== 'open' && s.state !== 'selected') return;
        this.blocked = null;
        const sl = this.draft.slots;
        if (sl.includes(s.h)){ if (s.h === sl[0]) sl.shift(); else if (s.h === sl[sl.length - 1]) sl.pop(); else this.draft.slots = [s.h]; return; }
        if (sl.length && (s.h === sl[0] - 1 || s.h === sl[sl.length - 1] + 1)){ sl.push(s.h); sl.sort((a, b) => a - b); return; }
        this.draft.slots = [s.h]; return;
      }
      if (s.state === 'mine'){ this.toast('You already have this hour.'); return; }
      if (s.state !== 'open' && s.state !== 'selected') return;
      const sl = this.draft.slots; const i = sl.indexOf(s.h);
      if (i > -1){ sl.splice(i, 1); return; }
      const cap = MAX_HOURS - this.myHoursOn(this.draft.date);
      if (cap <= 0){ this.toast('You already have 2 hours booked that day.'); return; }
      if (!sl.length){ sl.push(s.h); return; }
      if (sl.length >= cap){ this.toast(cap === 1 ? 'You have 1 hour left to book that day.' : 'Up to 2 hours a day. Tap a selected hour to remove it.'); return; }
      if (Math.abs(sl[0] - s.h) === 1){ sl.push(s.h); sl.sort((a, b) => a - b); return; }
      this.draft.slots = [s.h];
    },
    flowNext(){
      if (this.step === 1){ if (!this.draft.date){ this.toast('Pick a date first.'); return; } const c = this.court(this.draft.court); if (!c || c.status !== 'open') this.draft.court = this.courts.find(c => c.status === 'open').id; this.step = 2; }
      else if (this.step === 2){ if (!this.draft.slots.length){ this.toast('Pick at least one hour.'); return; } this.draft.agree = false; this.agreeErr = false; this.step = 3; }
      else if (this.step === 3){ this.confirmBooking(); return; }
      window.scrollTo(0, 0);
    },
    flowBack(){ if (this.step > 1 && this.step < 4){ this.step--; window.scrollTo(0, 0); } else this.exitFlow(); },
    exitFlow(){ this.go('home'); },
    confirmBooking(){
      const d = this.draft; const club = this.isAdminFlow;
      if (club && !d.purpose.trim()){ this.purposeErr = true; return; }
      if (!club && !d.agree){ this.agreeErr = true; return; }
      if (d.slots.some(h => !this.isFree(d.date, d.court, h))){ this.toast('Someone just took one of those hours. Pick again.'); this.step = 2; return; }
      this.seq++;
      const b = {id:'b' + this.seq, code:codeOf(d.date, this.seq), userId:this.auth.userId, court:d.court, date:d.date, start:this.draftStart, end:this.draftEnd, status:'confirmed', createdAt:this.clock(), reason:null, purpose: club ? d.purpose.trim() : null};
      this.bookings.push(b); this.lastBookingId = b.id;
      this.step = 4; window.scrollTo(0, 0);
      setTimeout(() => {
        this.log({kind:'booking.created', userId:b.userId, bookingId:b.id, text: club ? 'Club booking on ' + this.courtName(b.court) + ' for ' + fmtDate(b.date) + ', ' + range(b) + ': ' + b.purpose : 'Booked ' + this.courtName(b.court) + ' for ' + fmtDate(b.date) + ', ' + range(b)});
      }, 900);
    },
    clock(){ this.tick++; return new Date(NOW.getTime() + this.tick * 6e4); },
    log(o){ this.eseq++; this.events.push(Object.assign({id:'e' + this.eseq, source:'Make.com', at:this.clock()}, o)); },
    openBooking(id){ this.selBookingId = id; this.menuId = null; this.go('booking'); },
    toggleMenu(id){ this.menuId = this.menuId === id ? null : id; },
    openCancel(id, admin){ this.menuId = null; this.sheet = {id, admin: !!admin, reason:null, note:'', ack1:false, ack2:false, errs:{}}; },
    doCancel(){
      const b = this.sheetBooking; if (!b) return;
      const sh = this.sheet;
      if (sh.admin){
        const who = b.purpose ? null : this.member(b.userId).first;
        const errs = {};
        if (!sh.reason) errs.reason = 'Pick a reason.';
        if (sh.note.trim().length < 15) errs.note = who ? 'Write at least a sentence so ' + who + ' knows why.' : 'Write at least a sentence for the log.';
        if (!sh.ack1 || (who && !sh.ack2)) errs.ack = who ? 'Tick both boxes to confirm.' : 'Tick the box to confirm.';
        if (Object.keys(errs).length){ sh.errs = errs; return; }
        b.status = 'cancelled'; b.reason = sh.reason; b.note = sh.note.trim(); b.byClub = true;
        this.log({kind:'booking.cancelled', userId:b.userId, bookingId:b.id, text:'Cancelled by the club: ' + this.courtName(b.court) + ' on ' + fmtDate(b.date) + ', ' + range(b) + '. Reason: ' + sh.reason.toLowerCase() + '. Message: "' + b.note + '"'});
        this.sheet = null; this.toast(who ? who + "'s booking is cancelled. They'll see your message." : 'Club booking cancelled.');
        return;
      }
      if (!this.canCancel(b)){ this.toast('This booking can no longer be cancelled.'); this.sheet = null; return; }
      b.status = 'cancelled'; b.reason = sh.reason;
      this.log({kind:'booking.cancelled', userId:b.userId, bookingId:b.id, text:'Cancelled ' + this.courtName(b.court) + ' on ' + fmtDate(b.date) + ', ' + range(b) + (sh.reason ? '. Reason: ' + sh.reason.toLowerCase() : '')});
      this.sheet = null; this.toast('Booking cancelled. The hour is free again.');
    },
    availFor(date, item){ const it = this.equipment.find(e => e.id === item); const used = this.loans.filter(l => l.date === date && (l.status === 'reserved' || l.status === 'out')).reduce((s, l) => s + l[item], 0); return Math.max(0, it.total - used); },
    bump(obj, item, delta, date){
      const it = this.equipment.find(e => e.id === item); const next = obj[item] + delta;
      if (next < 0) return;
      if (next > it.max){ this.toast('Up to ' + it.max + ' ' + it.plural.toLowerCase() + ' a day.'); return; }
      if (date && next > this.availFor(date, item)){ this.toast('Only ' + this.availFor(date, item) + ' free that day.'); return; }
      obj[item] = next; this.loanErr = '';
    },
    myLoanOn(date){ return this.loans.find(l => l.userId === this.auth.userId && l.date === date && l.status !== 'returned'); },
    addLoan(date, racket, balls){ this.lseq++; const l = {id:'l' + this.lseq, userId:this.auth.userId, date, racket, balls, status:'reserved'}; this.loans.push(l); return l; },
    pickLoanDay(d){ if (d.closed){ this.toast(this.closedDays[d.iso]); return; } this.loanDraft.date = d.iso; this.loanErr = ''; },
    reserveLoan(){
      const d = this.loanDraft; this.loanErr = '';
      if (!d.racket && !d.balls){ this.loanErr = 'Choose a racket or a can of balls first.'; return; }
      if (this.myLoanOn(d.date)){ this.loanErr = 'You already have equipment reserved for ' + fmtDate(d.date) + '.'; return; }
      const l = this.addLoan(d.date, d.racket, d.balls);
      this.log({kind:'loan.reserved', userId:l.userId, loanId:l.id, text:'Reserved ' + itemsText(l) + ' for ' + fmtDate(l.date)});
      this.toast('Reserved for ' + fmtDate(d.date) + '. Collect from the court attendant.');
      d.racket = 0; d.balls = 0;
    },
    setLoan(l, status){
      l.status = status;
      this.log({kind: status === 'out' ? 'loan.picked_up' : 'loan.returned', userId:l.userId, loanId:l.id, text:(status === 'out' ? 'Picked up ' : 'Returned ') + itemsText(l)});
      this.toast(status === 'out' ? 'Marked as picked up.' : 'Marked as returned.');
    },
    saveCourt(c){
      const e = this.courtEdit[c.id];
      const note = e.status === 'closed' ? (e.note.trim() || 'Closed for maintenance.') : '';
      if (e.status === c.status && note === c.note){ this.toast('Nothing changed.'); return; }
      c.status = e.status; c.note = note; e.note = note;
      this.log({kind: c.status === 'open' ? 'court.opened' : 'court.closed', userId:this.auth.userId, source:'App', text: c.status === 'open' ? 'Reopened ' + c.name : 'Closed ' + c.name + ': ' + note});
      this.toast(c.name + (c.status === 'open' ? ' is open for booking.' : ' is closed.'));
    },
    copyPhone(){
      const done = () => this.toast('Number copied.');
      try { navigator.clipboard.writeText('0617830155').then(done, () => this.toast('Copy the number: 061-783-0155')); } catch (e) { this.toast('Copy the number: 061-783-0155'); }
    }
  },
  mounted(){
    const ok = ['home','book','booking','bookings','borrow','club','profile'];
    const h = location.hash.slice(1);
    if (h.indexOf('admin-') === 0) this.demo('admin', h);
    else if (ok.includes(h)) this.demo('student', h);
    window.addEventListener('hashchange', () => {
      const h = location.hash.slice(1);
      if (!this.auth || !h || h === this.screen) return;
      if (h === 'signin'){ this.signOut(); return; }
      if (ok.includes(h) || h.indexOf('admin-') === 0) this.applyScreen(h);
    });
    document.addEventListener('click', () => { this.menuId = null; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape'){ this.sheet = null; this.menuId = null; } });
  }
});
app.component('icon', Icon);
app.component('club-logo', ClubLogo);
app.component('ig-glyph', IgGlyph);
app.component('court-art', CourtArt);
app.component('racket-art', RacketArt);
app.component('balls-art', BallsArt);
app.mount('#app');
})();
</script>
